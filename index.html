<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Semana al Día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0} [hidden]{display:none!important} img{max-width:100%}
/* Layout: mismo orden que antes (pestañas → banner con la mascota + cuenta regresiva → paneles en 2 columnas), vestido estilo Omarchy: ventanas cuadradas de terminal, mono, fondo con pixeles y temas intercambiables. Look oscuro único a propósito. */
:root{
  --bg:#1a1b26; --surface:#1f2030; --surface-2:#24283b; --ink:#c0caf5; --muted:#7c84b0; --line:#3b4261;
  --accent:#7aa2f7; --coral:#f7768e; --sun:#e0af68; --r1:#9ece6a; --r2:#bb9af7; --ok:#9ece6a; --cyan:#7dcfff; --on:#1a1b26; --r3:#ff9e64;
  --r1-soft:color-mix(in srgb,var(--r1) 14%,var(--surface)); --r2-soft:color-mix(in srgb,var(--r2) 14%,var(--surface)); --r3-soft:color-mix(in srgb,var(--r3) 14%,var(--surface));
  --sun-soft:color-mix(in srgb,var(--sun) 14%,var(--surface)); --coral-soft:color-mix(in srgb,var(--coral) 14%,var(--surface));
  --accent-soft:color-mix(in srgb,var(--accent) 16%,var(--surface)); --ok-soft:color-mix(in srgb,var(--ok) 14%,var(--surface));
  --accent-ink:var(--on); --coral-ink:var(--on); --sun-ink:var(--on);
  --f:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
:root[data-t="catppuccin"]{--bg:#1e1e2e;--surface:#232336;--surface-2:#2b2b3f;--ink:#cdd6f4;--muted:#8a8fab;--line:#45475a;--accent:#89b4fa;--coral:#f38ba8;--sun:#f9e2af;--r1:#a6e3a1;--r2:#cba6f7;--ok:#a6e3a1;--cyan:#94e2d5;--on:#1e1e2e;--r3:#fab387}
:root[data-t="gruvbox"]{--bg:#282828;--surface:#2e2c2a;--surface-2:#3c3836;--ink:#ebdbb2;--muted:#a89984;--line:#504945;--accent:#83a598;--coral:#fb4934;--sun:#fabd2f;--r1:#b8bb26;--r2:#d3869b;--ok:#b8bb26;--cyan:#8ec07c;--on:#282828;--r3:#fe8019}
:root[data-t="nord"]{--bg:#2e3440;--surface:#333a47;--surface-2:#3b4252;--ink:#e5e9f0;--muted:#97a1b6;--line:#4c566a;--accent:#88c0d0;--coral:#bf616a;--sun:#ebcb8b;--r1:#a3be8c;--r2:#b48ead;--ok:#a3be8c;--cyan:#8fbcbb;--on:#2e3440;--r3:#d08770}
:root[data-t="rosepine"]{--bg:#191724;--surface:#1f1d2e;--surface-2:#26233a;--ink:#e0def4;--muted:#908caa;--line:#403d52;--accent:#ebbcba;--coral:#eb6f92;--sun:#f6c177;--r1:#9ccfd8;--r2:#c4a7e7;--ok:#9ccfd8;--cyan:#31748f;--on:#191724;--r3:#ebbcba}
*{box-sizing:border-box;border-radius:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.55}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px;position:relative;z-index:1}
svg.i{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
.pixels{position:fixed;inset:0;pointer-events:none;z-index:0}
.pixels i{position:absolute;width:9px;height:9px;background:var(--line);opacity:.5}

/* barra superior tipo waybar */
.top{background:color-mix(in srgb,var(--bg) 80%,black);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:6px 16px;min-height:42px;flex-wrap:wrap;padding-block:4px}
.brand{margin:0;font-weight:800;font-size:15px;color:var(--accent);display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand em{font-style:normal;color:var(--ink)}
.logo-px{width:14px;height:14px;border:2px solid var(--accent);position:relative}
.logo-px::after{content:"";position:absolute;inset:2px;background:var(--accent)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs a{padding:4px 10px;color:var(--muted);text-decoration:none;white-space:nowrap;font-size:13px;display:flex;align-items:center;gap:6px}
.tabs a:hover{color:var(--ink);background:var(--surface-2)}
.tabs a .wsn{color:var(--line);font-weight:800}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--on);font-weight:700}
.tabs a[aria-current="page"] .wsn{color:var(--on)}
.tray{display:flex;align-items:center;gap:12px;white-space:nowrap}
.updated{font-size:11.5px;color:var(--muted)}
.themes{display:flex;gap:4px}
.themes button{width:14px;height:14px;border:1px solid var(--line);cursor:pointer;padding:0}
.themes button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.demo{background:var(--surface-2);color:var(--sun);font-size:12.5px;padding-block:6px;border-bottom:1px solid var(--line);position:relative;z-index:1}

main{padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-weight:800;font-size:26px;line-height:1.15}
h2{font-weight:700;font-size:16.5px;line-height:1.3}
h3{font-size:14px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:12.5px} .mono{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.panel{background:var(--surface);border:2px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel:hover,.rcard:hover,.news:hover{border-color:var(--accent)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel h2::before{content:"# ";color:var(--accent)}
.more{font-size:12.5px;font-weight:700;text-decoration:none}

/* banner mascota + cuenta regresiva */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}
.cat-card{background:var(--surface);border:2px solid var(--sun);padding:30px 16px 14px;display:flex;align-items:flex-end;gap:14px;position:relative;min-height:200px}
.cat-week{position:absolute;left:-2px;top:-2px;background:var(--sun);color:var(--on);font-size:11.5px;font-weight:800;padding:2px 10px}
.cat-week::before{content:"zsh · "}
.cat-btn{border:0;background:none;padding:0;cursor:pointer;flex:none}
.cat{width:150px;height:auto;display:block}
.cat-btn:active .cat{transform:translateY(2px)}
.bubble{align-self:center;background:var(--surface-2);border-left:3px solid var(--sun);padding:12px 14px;font-weight:500;font-size:16px;line-height:1.4;max-width:440px}
.bubble::before{content:"~ ❯ ";color:var(--r1);font-weight:700}
.bubble small{display:block;font-size:11px;color:var(--muted);margin-top:6px;font-weight:400}
.cd-card{background:var(--surface);border:2px solid var(--coral);padding:14px 16px;display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.cd-card .eyebrow{color:var(--coral)}
.cd-card h2{color:var(--ink)!important}
.cd-card.calm{border-color:var(--line)}
.cd-card.calm .eyebrow{color:var(--muted)}
.cd-list{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 10px;align-items:center;margin-top:8px;font-size:13px}
.cd-list .chip{justify-content:center}
.tiles{display:flex;gap:8px}
.tile{flex:1;border:1px solid var(--coral);padding:8px 4px;text-align:center}
.cd-card.calm .tile{border-color:var(--line)}
.tile b{display:block;font-weight:800;font-size:34px;line-height:1.05;color:var(--coral)}
.tile span{font-size:11px;color:var(--muted)}
.tiles.sm .tile b{font-size:24px}

/* tira semanal */
.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;border:1px solid var(--line)}
.wd{border-left:1px solid var(--line);padding:8px 6px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:108px;text-decoration:none;color:inherit;background:var(--surface)}
.wd:first-child{border-left:0}
.wd:hover{background:var(--surface-2)}
.wd.today{background:var(--surface-2);box-shadow:inset 0 3px 0 var(--accent)}
.wd.feriado{background:repeating-linear-gradient(45deg,var(--surface),var(--surface) 6px,var(--surface-2) 6px,var(--surface-2) 12px)}
.wd .dname{font-size:11px;color:var(--muted)}
.wd .dnum{font-weight:800;font-size:22px;line-height:1}
.wd.today .dnum{color:var(--accent)}
.wd .chips{display:flex;flex-direction:column;gap:3px;width:100%}
.mini{font-size:10.5px;font-weight:700;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.mini.r1{color:var(--r1);border-left:2px solid var(--r1)} .mini.r2{color:var(--r2);border-left:2px solid var(--r2)}
.mini.r3{color:var(--r3);border-left:2px solid var(--r3)} .mini.r3{color:var(--r3);border-left:2px solid var(--r3)}
.mini.entrega{background:var(--coral);color:var(--on)} .mini.feriado{color:var(--muted);font-weight:400}
.mini.gen{color:var(--accent);border-left:2px solid var(--accent)}

/* alertas */
.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--sun-soft);border:1px solid var(--sun);padding:8px 10px;font-size:13px}
.alert .ico{flex:none;width:24px;height:24px;background:var(--sun);color:var(--on);display:grid;place-items:center}
.alert .ico svg{width:14px;height:14px}

/* tarjetas de ramo */
.rcard{background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;min-width:0}
.rhead{padding:9px 14px;display:flex;gap:12px;align-items:center;background:var(--surface-2);border-bottom:1px solid var(--line)}
.rhead .ricon{width:36px;height:36px;display:grid;place-items:center;flex:none;color:var(--on)}
.rhead.r1 .ricon{background:var(--r1)} .rhead.r2 .ricon{background:var(--r2)}
.rhead.r3 .ricon{background:var(--r3)} .rhead.r3 .ricon{background:var(--r3)}
.rhead .t{display:flex;flex-direction:column;min-width:0}
.rhead .t b{font-size:16px;font-weight:800;line-height:1.2}
.rhead.r1 .t b{color:var(--r1)} .rhead.r2 .t b{color:var(--r2)}
.rhead.r3 .t b{color:var(--r3)} .rhead.r3 .t b{color:var(--r3)}
.rhead .t span{font-size:11.5px;color:var(--muted)}
.rbody{padding:14px;display:flex;flex-direction:column;gap:12px}
.topic{font-weight:700;font-size:15.5px;line-height:1.35}
.act{display:flex;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--line);padding:10px}
.dateblock{flex:none;width:62px;background:var(--coral);color:var(--on);text-align:center;padding:5px 0;line-height:1.05}
.dateblock b{display:block;font-size:24px;font-weight:800}
.dateblock span{font-size:10px;font-weight:700;text-transform:uppercase}
.dateblock.unknown{background:var(--line);color:var(--ink)}
.act .info{display:flex;flex-direction:column;gap:6px;min-width:0}
.act .info b{font-size:13.5px;line-height:1.35}
.chips-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:1px 8px;border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.chip svg.i{width:12px;height:12px}
.chip.sum{color:var(--sun);border-color:var(--sun)}
.chip.hot{background:var(--coral);border-color:var(--coral);color:var(--on)}
.chip.r1{color:var(--r1);border-color:var(--r1)} .chip.r2{color:var(--r2);border-color:var(--r2)}
.chip.r3{color:var(--r3);border-color:var(--r3)} .chip.r3{color:var(--r3);border-color:var(--r3)}
.chip.gen{color:var(--accent);border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;font-weight:700;font-size:13px;text-decoration:none;background:var(--accent);color:var(--on);border:0;cursor:pointer;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}

.ringwrap{display:flex;align-items:center;gap:16px}
.ring{width:92px;height:92px;flex:none}
.ring circle:last-of-type{stroke-linecap:butt}
.ring text{font-family:var(--f);font-weight:800;fill:var(--ink)}

/* detalle de ramo */
.banner{background:var(--surface);border:2px solid var(--line);padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.banner.r1{border-color:var(--r1);box-shadow:inset 6px 0 0 var(--r1)} .banner.r2{border-color:var(--r2);box-shadow:inset 6px 0 0 var(--r2)}
.banner.r3{border-color:var(--r3);box-shadow:inset 6px 0 0 var(--r3)} .banner.r3{border-color:var(--r3);box-shadow:inset 6px 0 0 var(--r3)}
.banner .ricon{width:56px;height:56px;display:grid;place-items:center;color:var(--on);margin-left:6px}
.banner.r1 .ricon{background:var(--r1)} .banner.r2 .ricon{background:var(--r2)}
.banner.r3 .ricon{background:var(--r3)} .banner.r3 .ricon{background:var(--r3)}
.banner .ricon svg{width:28px;height:28px}
.banner .grow{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
.banner .sched{display:flex;gap:6px;flex-wrap:wrap}
.banner .sched span{border:1px solid var(--line);background:var(--surface-2);padding:1px 8px;font-size:12px}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.step{background:var(--surface-2);padding:10px;display:flex;gap:10px;font-size:13px;line-height:1.45}
.step .n{flex:none;width:24px;height:24px;display:grid;place-items:center;font-weight:800;color:var(--on)}
.deliv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.dv{border:1px dashed var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;font-weight:600;line-height:1.4}
.dv .ico{width:32px;height:32px;display:grid;place-items:center}
.stack{display:flex;height:18px;gap:2px}
.stack i{display:block;height:100%}
.stack-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px;font-size:12px}
.stack-legend div{display:flex;gap:8px;align-items:center}
.stack-legend s{text-decoration:none;width:11px;height:11px;flex:none}
.stack-legend b{margin-left:auto}
.tline{overflow-x:auto;padding-bottom:4px}
.tline-in{display:flex;align-items:flex-start;min-width:560px;position:relative;padding-top:6px}
.tline-in::before{content:"";position:absolute;left:5%;right:5%;top:20px;height:2px;background:var(--line)}
.node{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center}
.node .c{width:30px;height:30px;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:12px;z-index:1}
.node.sum .c{border-color:var(--sun);color:var(--sun)}
.node.eft .c{border-color:var(--coral);background:var(--coral);color:var(--on)}
.node.past .c{background:var(--ok);border-color:var(--ok);color:var(--on)}
.node.cur .c{box-shadow:0 0 0 3px var(--accent)}
.node .l{font-size:11px;color:var(--muted);line-height:1.2;max-width:80px}
.tips{display:flex;flex-direction:column;gap:8px}
.tip{display:flex;gap:10px;font-size:13px;align-items:flex-start}
.tip .ico{flex:none;width:26px;height:26px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.glos{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.term{padding:10px;background:var(--surface-2);border-left:2px solid var(--line);font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.term b{font-size:13px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lk{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);padding:5px 10px;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--ink)}
.lk:hover{border-color:var(--accent);color:var(--accent)}
.lk.off{color:var(--muted);border-style:dashed;background:transparent}
details.more-box summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:13px}
details.more-box[open] summary{margin-bottom:8px}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
ul.clean li::marker{color:var(--accent)}
.empty{padding:14px;text-align:center;color:var(--muted);border:1px dashed var(--line);font-size:13px}

/* clases */
.rec-grid{display:grid;grid-template-columns:64px repeat(2,minmax(0,1fr));gap:8px;align-items:center}
.rec-grid .wk{font-weight:800}
.rec-grid .wk small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.recs{display:flex;gap:6px;flex-wrap:wrap}
.play{display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 3px;font-size:11.5px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);text-decoration:none}
.play i{width:18px;height:18px;display:grid;place-items:center;color:var(--on);font-style:normal}
.play i::before{content:"";border-left:6px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;margin-left:2px}
.rec-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* calendario */
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cal-nav{display:flex;gap:4px}
.navbtn{border:1px solid var(--line);background:var(--surface-2);padding:4px 12px;cursor:pointer;font-weight:700}
.navbtn:hover{border-color:var(--accent);color:var(--accent)}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);padding:3px 11px;cursor:pointer;font-size:12.5px;font-weight:700}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--on);border-color:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;padding:2px}
.day{min-height:92px;border:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;background:var(--surface);text-align:left;min-width:0}
.day:hover{border-color:var(--accent)}
.day.out{opacity:.4}
.day.today{border:2px solid var(--accent)}
.day.today .num{color:var(--accent)}
.day.sel{box-shadow:inset 0 0 0 2px var(--sun)}
.day.feriado{background:repeating-linear-gradient(45deg,var(--surface),var(--surface) 6px,var(--surface-2) 6px,var(--surface-2) 12px)}
.day .num{font-weight:800;font-size:14px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:7px;height:7px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend s{text-decoration:none;width:10px;height:10px;display:inline-block}
.agenda{display:flex;flex-direction:column;gap:8px}
.ag{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ag .when{flex:none;width:60px;text-align:center;background:var(--surface-2);border:1px solid var(--line);padding:4px 0;line-height:1.1}
.ag .when b{display:block;font-size:17px}
.ag .when span{font-size:10.5px;color:var(--muted)}
.ag .grow{flex:1;min-width:150px;font-size:13px}
.ag a{font-size:12px;font-weight:700}

/* noticias */
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.news{background:var(--surface);border:2px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}
.news .nic,.nic{width:38px;height:38px;display:grid;place-items:center}
.news h3{font-weight:700;font-size:15px;line-height:1.35}

/* historial */
details.week{background:var(--surface);border:2px solid var(--line)}
details.week[open]{border-color:var(--accent)}
details.week summary{padding:12px 16px;cursor:pointer;display:flex;gap:12px;align-items:center;flex-wrap:wrap;list-style:none}
details.week summary::-webkit-details-marker{display:none}
details.week summary::before{content:"▸";color:var(--accent)}
details.week[open] summary::before{content:"▾"}
details.week summary .wn{font-weight:800;font-size:16px}
details.week .body{padding:0 16px 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
details.week .hb{padding:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;font-size:13px}

/* carrera */
.road{position:relative;padding:74px 8px 8px}
.road-line{display:flex;gap:4px}
.road-line .seg{flex:1;height:14px;background:var(--line)}
.road-line .seg.done{background:var(--ok)} .road-line .seg.cur{background:linear-gradient(90deg,var(--ok) var(--p),var(--line) var(--p))}
.road-lbl{display:flex;gap:4px;margin-top:6px}
.road-lbl span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.road .catpin{position:absolute;top:0;height:70px;transform:translateX(-50%)}
.road .catpin .cat{width:auto;height:70px}
.road .flag{position:absolute;right:0;top:40px;font-size:20px}
.malla-wrap{overflow-x:auto}
.malla{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;min-width:860px}
.sem{display:flex;flex-direction:column;gap:4px}
.sem h4{margin:0;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:3px 0;border-bottom:2px solid var(--line)}
.sem.cursando h4{color:var(--sun);border-color:var(--sun)}
.ramo{font-size:10.5px;padding:5px 6px;border:1px solid var(--line);line-height:1.3;display:flex;flex-direction:column;gap:4px;min-height:58px;hyphens:auto;overflow-wrap:anywhere}
.ramo .st{align-self:flex-start;font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:0 4px;border:1px solid currentColor;white-space:nowrap}
.ramo.aprobado{color:var(--muted);opacity:.55;border-style:dashed}
.ramo.aprobado .st{color:var(--ok)}
.ramo.cursando{background:var(--sun-soft);border-color:var(--sun);color:var(--ink);font-weight:700}
.ramo.cursando .st{color:var(--sun)}
.ramo.pendiente{color:var(--ink)}
.ramo.pendiente .st{color:var(--muted)}
.bigstat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bigstat div{background:var(--surface-2);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:2px}
.bigstat b{font-size:28px;line-height:1.05;color:var(--accent)}
/* Inicio */
.cards-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rcard.ghost{border-style:dashed;opacity:.6}
.rcard.ghost .ricon{background:var(--line)}
.home-cal{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px}
.cal.compact{gap:3px}
.cal.compact .day{min-height:62px;padding:4px}
.cal.compact .day .dots{display:flex;margin-top:auto}
.cal.compact .mini{font-size:10px}
.career-mini{display:flex;gap:16px;align-items:center}
.career-mini > b{font-size:34px;font-weight:800;color:var(--accent);line-height:1}
.career-mini .road-line .seg{height:12px}
.nic{width:32px;height:32px;display:grid;place-items:center;flex:none}
.ramos-switch{display:flex;gap:6px;flex-wrap:wrap}
.ramos-switch .fchip{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:13.5px;padding:6px 14px}
.ramos-switch .fchip.r1[aria-pressed="true"]{background:var(--r1);border-color:var(--r1);color:var(--on)}
.ramos-switch .fchip.r3[aria-pressed="true"]{background:var(--r3);border-color:var(--r3);color:var(--on)}
.ramos-switch .fchip.r2[aria-pressed="true"]{background:var(--r2);border-color:var(--r2);color:var(--on)}
.ramos-switch .fchip.off{border-style:dashed;color:var(--muted);cursor:default}
footer{font-size:12px;color:var(--muted);padding-block:0 32px;position:relative;z-index:1}

@media (max-width:980px){ .cards-3{grid-template-columns:1fr 1fr} }
@media (max-width:860px){
  .grid,.hero,details.week .body,.steps,.home-cal,.cards-3{grid-template-columns:1fr}
  .tabs{order:3;flex-basis:100%}
  .tray{margin-left:auto}
  .day{min-height:56px;padding:4px}
  .day .mini{display:none}
  .cal.compact .day{min-height:48px}
  .day .dots{display:flex}
  .weekstrip{grid-template-columns:repeat(7,minmax(80px,1fr));overflow-x:auto}
  .stack-legend{grid-template-columns:1fr}
  .rec-grid{grid-template-columns:50px repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .cat-card{flex-direction:column;align-items:flex-start}
  .cat{width:110px}
  .bubble{font-size:14.5px}
  .tile b{font-size:28px}
  h1{font-size:22px}
  .bigstat{grid-template-columns:1fr}
  .updated{display:none}
}
</style>
</head>
<body>

<div class="pixels" id="pixels" aria-hidden="true"></div>
<header class="top">
  <div class="wrap top-row">
    <p class="brand"><span class="logo-px" aria-hidden="true"></span>Semana <em>@</em>al día CAMBIO</p>
    <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
    <div class="tray"><span class="updated" id="updated"></span><div class="themes" id="themes" aria-label="Tema de colores"></div></div>
  </div>
</header>
<div class="demo" id="demo" hidden><div class="wrap" id="demo-text"></div></div>
<main class="wrap" id="view"></main>
<footer class="wrap">Resúmenes hechos por el curso a partir del material de cada ramo. Los documentos oficiales están en AVA: si algo no cuadra, manda lo que diga AVA o el profe.</footer>

<script src="data/general.js"></script>
<script src="data/cbbdd.js"></script>
<script src="data/etica.js"></script>
<script src="data/cloud.js"></script>
<script>
/* =====================================================================
   DATOS — vienen de data/*.js (eso es lo que se actualiza cada semana)
   ===================================================================== */
// Junta los datos: cada archivo de ramo trae sus semanas, entregas y noticias
const DATA = window.DATA;
DATA.semanas = {};
for (const r of DATA.ramos){
  for (const [n, s] of Object.entries(r.semanas || {})) (DATA.semanas[n] ||= {})[r.id] = s;
  DATA.eventos.push(...(r.eventos || []));
  DATA.noticias.push(...(r.noticias || []));
}
DATA.noticias.sort((a, b) => b.fecha.localeCompare(a.fecha));

/* =====================================================================
   Lógica
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW = ['dom','lun','mar','mié','jue','vie','sáb'];
const DOWL = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const pad = n => String(n).padStart(2,'0');
function dt(s){ const [d,t] = s.split('T'); const [y,m,dd] = d.split('-').map(Number); const [h,mi] = (t||'00:00').split(':').map(Number); return new Date(y,m-1,dd,h,mi); }
const isoD = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const ddmm = d => pad(d.getDate())+'/'+pad(d.getMonth()+1);
const hhmm = d => pad(d.getHours())+':'+pad(d.getMinutes());
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const sameDay = (a,b) => isoD(a)===isoD(b);

const NOW = DATA.hoySimulado ? dt(DATA.hoySimulado) : new Date();
const B0 = dt(DATA.bimestre.inicio);
const weekStart = n => addDays(B0, (n-1)*7);
const weekOf = d => Math.floor((d - B0) / (7*864e5)) + 1;
const CUR = Math.max(1, Math.min(DATA.bimestre.semanas, weekOf(NOW)));
const TERMINADO = weekOf(NOW) > DATA.bimestre.semanas;
const conContenido = Object.keys(DATA.semanas).map(Number).filter(n => Object.values(DATA.semanas[n]).some(r => r.actividad || r.clases)).sort((a,b) => a-b);
const SEM = [...conContenido].reverse().find(n => n <= CUR) || conContenido[conContenido.length-1];
const ramoById = id => DATA.ramos.find(r => r.id===id);

const ICONS = {
  code:'<path d="M8 6l-6 6 6 6M16 6l6 6-6 6M14 4l-4 16"/>',
  db:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5M16 4.5a3.5 3.5 0 010 7M18 14.5c2.5.5 4 2.3 4 5.5"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  file:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/>',
  zip:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M11 4v2M11 8v2M11 12v2M10 16h2v2h-2z"/>',
  github:'<path d="M9 19c-4 1.5-4-2-6-2.5M15 21v-3.5a3 3 0 00-.9-2.3c3 -.3 6-1.5 6-6.5a5 5 0 00-1.4-3.5 4.6 4.6 0 00-.1-3.5s-1.1-.3-3.6 1.4a12 12 0 00-6.4 0C6.1 1.4 5 1.7 5 1.7a4.6 4.6 0 00-.1 3.5A5 5 0 003.5 8.7c0 5 3 6.2 6 6.5a3 3 0 00-.9 2.3V21"/>',
  commit:'<circle cx="12" cy="12" r="4"/><path d="M2 12h6M16 12h6"/>',
  alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5v.5"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z"/>',
  video:'<rect x="2" y="5" width="14" height="14" rx="3"/><path d="M16 10l6-3v10l-6-3"/>',
  book:'<path d="M4 4h6a3 3 0 013 3v13a2 2 0 00-2-2H4zM20 4h-6a3 3 0 00-3 3v13a2 2 0 012-2h7z"/>',
  download:'<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>',
  star:'<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9z"/>',
  wrench:'<path d="M14.5 6.5a4 4 0 015 5L11 20a2.1 2.1 0 01-3-3l8.5-8.5"/><path d="M14.5 6.5L17 4"/>',
  folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
  play:'<path d="M7 4l13 8-13 8z"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  cloud:'<path d="M7 18a5 5 0 01-.6-9.96A6 6 0 0118 9a4 4 0 01-1 9z"/>',
};
const icon = (k, st) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true" ${st?`style="${st}"`:''}>${ICONS[k]||ICONS.star}</svg>`;

// La mascota (sin nombre por ahora)
const BUGY = 'assets/mascota.webp';
function catSVG(cls){ return `<img class="${cls||'cat'}" src="${BUGY}" alt="La mascota del curso">`; }

function allEvents(){
  const ev = [];
  for (const r of DATA.ramos) for (let w = 1; w <= 8; w++) for (const s of r.secciones){
    const x = (s.excepciones||{})[w] || s;   // una semana puede cambiar de día u hora
    if (!x.dia || !x.hora) continue;
    const d = addDays(weekStart(w), x.dia-1); const [h,m] = x.hora.split(':').map(Number); d.setHours(h,m);
    ev.push({d, titulo:`${r.corto} ${s.profe.split(' ')[0]}`, ramo:r.id, tipo:'clase', profe:s.profe, seccion:s.seccion, link:s.link});
  }
  for (const e of DATA.eventos) ev.push({d:dt(e.fecha), titulo:e.titulo, ramo:e.ramo||'gen', tipo:e.tipo, allDay:!e.fecha.includes('T'), link:e.link||null, profe:e.titulo, seccion:'todas'});
  return ev.sort((a,b) => a.d-b.d);
}
const EVENTS = allEvents();
const nextDeadline = () => EVENTS.find(e => e.tipo==='entrega' && e.d > NOW);
const entregasDelDia = nd => nd ? EVENTS.filter(e => e.tipo==='entrega' && sameDay(e.d, nd.d) && e.d > NOW) : [];
function entregasLabel(nd){ const l = entregasDelDia(nd); return l.length > 1 ? `las ${l.length} entregas del ${DOWL[nd.d.getDay()].toLowerCase()}` : nd.titulo; }
function gcal(titulo, d, mins){
  const end = new Date(d.getTime() + (mins||60)*6e4);
  const f = x => x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+'T'+pad(x.getHours())+pad(x.getMinutes())+'00';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(titulo)+'&dates='+f(d)+'/'+f(end)+'&ctz=America/Santiago';
}
function parts(d){ let ms = Math.max(0, d - NOW); const D = Math.floor(ms/864e5); ms -= D*864e5; const H = Math.floor(ms/36e5); ms -= H*36e5; return {D, H, M:Math.floor(ms/6e4)}; }
function tiles(d, sm){ const p = parts(d); return `<div class="tiles ${sm?'sm':''}"><div class="tile"><b>${p.D}</b><span>días</span></div><div class="tile"><b>${p.H}</b><span>horas</span></div><div class="tile"><b>${p.M}</b><span>min</span></div></div>`; }

/* ----- gata ----- */
function catPhrases(ctx){
  const g = DATA.gata, nd = nextDeadline(), out = [];
  const h = nd ? Math.round((nd.d - NOW)/36e5) : null;
  const fill = s => s.replace('{h}', h).replace('{e}', entregasLabel(nd));
  if (nd && h <= 24) out.push(...g.hoy.map(fill));
  if (ctx==='inicio'){
    const start = NOW.getDate() % g.chistes.length;   // chiste del día
    out.push(...g.chistes.slice(start), ...g.chistes.slice(0, start));
    if (nd && h > 24 && h <= 120) out.push(...g.pronto.map(fill));
    return out.concat(g.general);
  }
  if (ctx && g[ctx]) out.push(...g[ctx]);
  return out.concat(g.general);
}
let catIdx = 0, catList = [], catCtx = null;
function catCard(ctx){
  if (catCtx !== ctx){ catList = catPhrases(ctx); catIdx = 0; catCtx = ctx; }
  return `<div class="cat-card"><span class="cat-week">Semana ${CUR} de ${DATA.bimestre.semanas}${TERMINADO?' · bimestre cerrado':''}</span>
    <button class="cat-btn" id="cat-btn" aria-label="Tocar a la mascota para otro chiste">${catSVG()}</button>
    <p class="bubble" aria-live="polite"><span id="cat-text">${esc(catList[catIdx])}</span><small>chiste del día · tócalo pa otro</small></p></div>`;
}

const chip = (k, txt, cls) => `<span class="chip ${cls||''}">${k?icon(k):''}${esc(txt)}</span>`;
const ramoChip = id => { const r = ramoById(id); return r ? chip(null, r.corto, id) : chip(null, 'General', 'gen'); };
const modoChip = m => m ? chip(m==='Grupal'?'users':'user', m, '') : '';
function dateBlock(e){ if (!e) return `<div class="dateblock unknown"><b>?</b><span>ver AVA</span></div>`; const d = dt(e); return `<div class="dateblock"><b>${d.getDate()}</b><span>${MES[d.getMonth()].slice(0,3)} · ${hhmm(d)}</span></div>`; }
function link(t, u, k){ return u ? `<a class="lk" href="${esc(u)}" target="_blank" rel="noopener">${icon(k||'arrow')}${esc(t)}</a>` : `<span class="lk off" title="El link no venía en el material">${icon(k||'arrow')}${esc(t)} · en AVA</span>`; }
function alertasDe(sem){ const out = [], s = DATA.semanas[sem] || {}; for (const id in s) (s[id].alertas||[]).forEach(a => out.push({id, a})); return out; }
function ring(val, max, label){
  const r = 38, c = 2*Math.PI*r, p = Math.min(1, val/max);
  return `<svg class="ring" viewBox="0 0 96 96" role="img" aria-label="${esc(label)}"><circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/>
    <circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 48 48)"/>
    <text x="48" y="54" text-anchor="middle" font-size="22">${val}/${max}</text></svg>`;
}

/* ---------- vistas ---------- */
let calMonth = new Date(NOW.getFullYear(), NOW.getMonth(), 1), calSel = isoD(NOW), calFiltro = 'todos';
const agRow = e => `<div class="ag"><span class="when"><b>${e.d.getDate()}</b><span>${DOW[e.d.getDay()]}${e.allDay?'':' '+hhmm(e.d)}</span></span><span class="grow">${e.tipo==='entrega'?chip(null,'Entrega','hot')+' ':e.tipo==='feriado'?chip(null,'Feriado')+' ':ramoChip(e.ramo)+' '}${esc(e.titulo)}</span>${e.tipo!=='feriado'?`<a href="${gcal(e.titulo,e.d,e.tipo==='entrega'?1:60)}" target="_blank" rel="noopener" title="Agregar a Google Calendar">+ cal</a>`:''}</div>`;
function calWidget(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y,m,1), start = addDays(first, -((first.getDay()+6)%7));
  const cells = [];
  for (let i = 0; i < 42; i++){
    const d = addDays(start,i); if (i>=35 && d.getMonth()!==m) break;
    const de = EVENTS.filter(e => sameDay(e.d,d)), fer = de.some(e => e.tipo==='feriado');
    const ent = de.find(e => e.tipo==='entrega');
    cells.push(`<button class="day ${d.getMonth()!==m?'out':''} ${sameDay(d,NOW)?'today':''} ${isoD(d)===calSel?'sel':''} ${fer?'feriado':''}" data-day="${isoD(d)}" aria-label="${d.getDate()} de ${MES[d.getMonth()]}, ${de.length} eventos">
      <span class="num">${d.getDate()}</span>${ent?`<span class="mini entrega">Entrega</span>`:''}${fer?`<span class="mini feriado">Feriado</span>`:''}
      <span class="dots">${de.filter(e => e.tipo==='clase').map(e => `<i style="background:var(--${e.ramo==='gen'?'accent':e.ramo})"></i>`).join('')}</span></button>`);
  }
  return `<div class="cal-head"><h2 style="text-transform:capitalize">${MES[m]} ${y}</h2>
      <div class="cal-nav"><button class="navbtn" data-cal="-1" aria-label="Mes anterior">←</button><button class="navbtn" data-cal="0">hoy</button><button class="navbtn" data-cal="1" aria-label="Mes siguiente">→</button></div></div>
    <div class="cal compact">${['L','M','M','J','V','S','D'].map(d => `<div class="dow">${d}</div>`).join('')}${cells.join('')}</div>
    <div class="legend">${DATA.ramos.map(r => `<span><s style="background:var(--${r.id})"></s>${esc(r.corto)}</span>`).join('')}<span><s style="background:var(--coral)"></s>Entrega</span><span><s style="background:var(--line)"></s>Feriado</span></div>`;
}
function vInicio(){
  const w = DATA.semanas[SEM] || {}, nd = nextDeadline(), al = alertasDe(SEM);
  const today0 = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
  const next7 = EVENTS.filter(e => e.d >= today0 && e.d < addDays(today0,7));
  const selD = dt(calSel), selEv = EVENTS.filter(e => sameDay(e.d, selD));
  const c = DATA.carrera, tot = c.bimestres.length, done = c.bimestres.filter(b => b.estado==='aprobado').length, frac = CUR/DATA.bimestre.semanas;
  const pct = Math.round((done + frac)/tot*100);
  const slots = Math.max(3, DATA.ramos.length);
  return `
  <section class="hero">
    ${catCard('inicio')}
    ${nd ? `<div class="cd-card"><div><span class="eyebrow">${entregasDelDia(nd).length > 1 ? 'Próximas entregas' : 'Próxima entrega'}</span><h2 style="margin-top:4px">${DOWL[nd.d.getDay()]} ${ddmm(nd.d)} · ${hhmm(nd.d)}</h2>
      <div class="cd-list">${entregasDelDia(nd).map(e => `${ramoChip(e.ramo)}<span>${esc(e.titulo.replace(/\s*(CBBDD|Ética|Intro Cloud)/, ''))}</span>`).join('')}</div></div>${tiles(nd.d)}</div>`
          : `<div class="cd-card calm"><span class="eyebrow">Próximas entregas</span><h2>Nada pendiente</h2><p class="small muted">Disfruta mientras dure.</p></div>`}
  </section>
  ${al.length?`<section class="alerts">${al.map(x => `<div class="alert"><span class="ico">${icon('alert')}</span><div>${ramoChip(x.id)} ${esc(x.a)}</div></div>`).join('')}</section>`:''}

function vCalendario(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y,m,1), start = addDays(first, -((first.getDay()+6)%7));
  const evs = EVENTS.filter(e => calFiltro==='todos' || e.ramo===calFiltro || e.ramo==='gen' || e.tipo==='feriado');
  const cells = [];
  for (let i = 0; i < 42; i++){
    const d = addDays(start,i); if (i>=35 && d.getMonth()!==m) break;
    const de = evs.filter(e => sameDay(e.d,d)), fer = de.some(e => e.tipo==='feriado');
    cells.push(`<button class="day ${d.getMonth()!==m?'out':''} ${sameDay(d,NOW)?'today':''} ${isoD(d)===calSel?'sel':''} ${fer?'feriado':''}" data-day="${isoD(d)}" aria-label="${d.getDate()} de ${MES[d.getMonth()]}, ${de.length} eventos">
      <span class="num">${d.getDate()}</span>
      ${de.slice(0,3).map(e => `<span class="mini ${e.tipo==='entrega'?'entrega':e.tipo==='feriado'?'feriado':e.ramo}">${e.tipo==='clase'?hhmm(e.d)+' ':''}${esc(e.titulo)}</span>`).join('')}
      ${de.length>3?`<span class="small muted" style="font-size:11px">+${de.length-3}</span>`:''}
      <span class="dots">${de.map(e => `<i style="background:var(--${e.tipo==='entrega'?'coral':e.tipo==='feriado'?'muted':e.ramo==='gen'?'accent':e.ramo})"></i>`).join('')}</span></button>`);
  }
  const selD = dt(calSel), selEv = evs.filter(e => sameDay(e.d, selD));
  const imp = evs.filter(e => e.d.getMonth()===m && e.d.getFullYear()===y && e.tipo!=='clase');
  const agRowOld = e => `<div class="ag"><span class="when"><b>${e.d.getDate()}</b><span>${DOW[e.d.getDay()]}${e.allDay?'':' '+hhmm(e.d)}</span></span><span class="grow">${e.tipo==='entrega'?chip(null,'Entrega','hot')+' ':e.tipo==='feriado'?chip(null,'Feriado')+' ':ramoChip(e.ramo)+' '}${esc(e.titulo)}</span>${e.tipo!=='feriado'?`<a href="${gcal(e.titulo,e.d,e.tipo==='entrega'?1:60)}" target="_blank" rel="noopener">+ Calendar</a>`:''}</div>`;
  return `
  <div class="cal-head"><h1 style="text-transform:capitalize">${MES[m]} ${y}</h1>
    <div class="cal-nav"><button class="navbtn" data-cal="-1" aria-label="Mes anterior">←</button><button class="navbtn" data-cal="0">Hoy</button><button class="navbtn" data-cal="1" aria-label="Mes siguiente">→</button></div></div>
  <div class="filters">${[['todos','Todo'],...DATA.ramos.map(r => [r.id, r.corto])].map(([k,l]) => `<button class="fchip" data-calf="${k}" aria-pressed="${calFiltro===k}">${esc(l)}</button>`).join('')}</div>
  <div class="cal">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d => `<div class="dow">${d}</div>`).join('')}${cells.join('')}</div>
  <div class="legend"><span><s style="background:var(--doo)"></s>DOO II</span><span><s style="background:var(--bd)"></s>MBBDD</span><span><s style="background:var(--coral)"></s>Entrega</span><span><s style="background:var(--accent)"></s>General</span><span><s style="background:var(--line)"></s>Feriado</span></div>
  <section class="grid">
    <div class="panel"><h2>${DOWL[selD.getDay()]} ${selD.getDate()} de ${MES[selD.getMonth()]}</h2><div class="agenda">${selEv.length ? selEv.map(agRow).join('') : '<div class="empty">Día libre. A dormir.</div>'}</div></div>
    <div class="panel"><h2>Fechas importantes del mes</h2><div class="agenda">${imp.length ? imp.map(agRow).join('') : '<div class="empty">Sin entregas ni feriados.</div>'}</div></div>
  </section>`;
}

    <div class="panel"><h2>Talleres y cursos</h2><div class="agenda">${DATA.talleres.map(x => { const d = dt(x.fecha); return `<div class="ag"><span class="when"><b>${d.getDate()}</b><span>${MES[d.getMonth()].slice(0,3)}</span></span><span class="grow">${chip(null, x.tipo)}<br>${esc(x.t)}</span>${link('Abrir', x.u, 'video')}</div>`; }).join('')}</div></div>
  </section>
  <section class="grid">${DATA.ramos.map(r => `<div class="panel"><div class="panel-head"><h2>${esc(r.corto)}</h2>${ramoChip(r.id)}</div><div class="links">${r.recursos.map(x => link(x.t, x.u, x.k)).join('')}</div></div>`).join('')}</section>`;
}
const TABS = [['inicio','Inicio'], ['ramos','Ramos'], ['clases','Clases'], ['noticias','Noticias'], ['recursos','Recursos'], ['carrera','Carrera']];
const current = () => {
  const h = location.hash.slice(1);
  if (h.startsWith('ramos')){ const id = h.split('-')[1]; if (ramoById(id)) ramoSel = id; return 'ramos'; }
  if (ramoById(h)){ ramoSel = h; return 'ramos'; }
  return TABS.some(t => t[0]===h) ? h : 'inicio';
};
function render(){
  const tab = current();
  $('#tabs').innerHTML = TABS.map(([k,l],i) => `<a href="#${k}" ${k===tab?'aria-current="page"':''}><span class="wsn">${i+1}</span>${esc(l)}</a>`).join('');
  $('#view').innerHTML = {inicio:vInicio, ramos:vRamos, clases:vClases, noticias:vNoticias, recursos:vRecursos, carrera:vCarrera}[tab]();
}
$('#updated').textContent = 'Actualizado el ' + ddmm(dt(DATA.actualizado));
if (DATA.hoySimulado){ $('#demo').hidden = false; $('#demo-text').textContent = `Vista de demostración: la página se muestra como si hoy fuera ${DOWL[NOW.getDay()].toLowerCase()} ${ddmm(NOW)}, en plena semana 8.`; }

window.addEventListener('hashchange', () => { render(); window.scrollTo({top:0}); });
document.addEventListener('click', e => {
  if (e.target.closest('#cat-btn')){ catIdx = (catIdx+1) % catList.length; const t = document.getElementById('cat-text'); if (t) t.textContent = catList[catIdx]; return; }
  const g = e.target.closest('[data-goto]'); if (g){ calSel = g.dataset.goto; const d = dt(calSel); calMonth = new Date(d.getFullYear(), d.getMonth(), 1); return; }
  const nav = e.target.closest('[data-cal]');
  if (nav){ const k = +nav.dataset.cal; calMonth = k===0 ? new Date(NOW.getFullYear(), NOW.getMonth(), 1) : new Date(calMonth.getFullYear(), calMonth.getMonth()+k, 1); if (k===0) calSel = isoD(NOW); render(); return; }
  const f = e.target.closest('[data-calf]'); if (f){ calFiltro = f.dataset.calf; render(); return; }
  const d = e.target.closest('[data-day]'); if (d){ calSel = d.dataset.day; const dd = dt(calSel); if (dd.getMonth()!==calMonth.getMonth()) calMonth = new Date(dd.getFullYear(), dd.getMonth(), 1); render(); }
});
setInterval(() => { if (!DATA.hoySimulado) render(); }, 60000);
const THEMES = [['tokyo','#7aa2f7','Tokyo Night'],['catppuccin','#cba6f7','Catppuccin'],['gruvbox','#fabd2f','Gruvbox'],['nord','#88c0d0','Nord'],['rosepine','#ebbcba','Rosé Pine']];
const themesEl = $('#themes');
function setTheme(t){
  if (t==='tokyo') document.documentElement.removeAttribute('data-t'); else document.documentElement.setAttribute('data-t', t);
  themesEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t===t));
  try { localStorage.setItem('sad-theme', t); } catch(e){}
}
themesEl.innerHTML = THEMES.map(([k,c,n]) => `<button data-t="${k}" style="background:${c}" title="${n}" aria-label="Tema ${n}"></button>`).join('');
themesEl.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTheme(b.dataset.t); });
let savedTheme = 'tokyo'; try { savedTheme = localStorage.getItem('sad-theme') || 'tokyo'; } catch(e){}
setTheme(THEMES.some(t => t[0]===savedTheme) ? savedTheme : 'tokyo');
document.addEventListener('keydown', e => { if (e.ctrlKey && e.shiftKey && e.code==='Space'){ const i = THEMES.findIndex(t => t[0]===(document.documentElement.dataset.t||'tokyo')); setTheme(THEMES[(i+1)%THEMES.length][0]); e.preventDefault(); } });
$('#pixels').innerHTML = Array.from({length:60}, () => `<i style="left:${Math.random()*100}%;top:${60+Math.random()*40}%"></i>`).join('');
render();
</script>

</body>
